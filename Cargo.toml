[workspace]
resolver = "3"
members = [
    "crates/hearthsound-plugin",
    "crates/hearthsound-plugin-acquisition",
    "crates/hearthsound-plugin-bindings",
    "crates/hearthsound-plugin-cli",
    "crates/hearthsound-plugin-metadata",
]
exclude = ["examples/hello-catalog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hearthsound/plugin-sdk"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
wit-bindgen = "0.62.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.58.6", default-features = false }
toml = "1.1.8"
wasmtime = "49.0.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
