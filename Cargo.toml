[workspace]
resolver = "3"
members = ["crates/hearthsound-plugin"]
exclude = ["examples/hello-catalog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hearthsound/plugin-sdk"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
wit-bindgen = "0.62.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
