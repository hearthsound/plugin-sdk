name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  example:
    name: Build and pack the example plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the example plugin
        run: cargo build --release --target wasm32-wasip2 --manifest-path examples/hello-catalog/Cargo.toml
      - name: Pack the example plugin
        run: cargo run -p hearthsound-plugin-cli -- pack --manifest examples/hello-catalog/manifest.json --wasm examples/hello-catalog/target/wasm32-wasip2/release/hello_catalog.wasm --out-dir dist
